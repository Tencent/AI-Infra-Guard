name: Go Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-test:
    name: Build and test Go packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build
        run: go build ./...

      # -count=1 关闭测试结果缓存，否则缓存命中会让坏掉的主分支看起来是绿的
      - name: Test
        run: go test ./... -count=1
