[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aig-model-scan"
version = "0.1.0"
description = "LLM red-team and jailbreak evaluation for AI-Infra-Guard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tencent Zhuque Lab", email = "zhuque@tencent.com" },
]
maintainers = [
  { name = "Tencent Zhuque Lab" },
]
keywords = [
  "ai-security",
  "red-team",
  "jailbreak",
  "llm",
  "ai-infra-guard",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "aiohttp>=3.11.18",
  "deepeval>=2.9.7,<3.7.6",
  "ecoji>=0.1.1",
  "grpcio>=1.67.1",
  "httpx>=0.27.0",
  "jieba>=0.42.1",
  "loguru>=0.7.3",
  "openai>=1.76.2",
  "openpyxl>=3.1.5",
  "pandas>=2.3.0",
  "pyahocorasick>=2.2.0",
  "pyarrow>=21.0.0",
  "requests>=2.31.0",
  "tabulate>=0.9.0",
  "tqdm>=4.66.1",
  "xlrd>=2.0.2",
  "zalgolib>=0.2.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "twine>=5.0",
]

[project.scripts]
aig-model-scan = "cli_run:cli"

[project.urls]
Homepage = "https://github.com/Tencent/AI-Infra-Guard"
Repository = "https://github.com/Tencent/AI-Infra-Guard"
Documentation = "https://github.com/Tencent/AI-Infra-Guard/tree/main/AIG-PromptSecurity"
"Bug Tracker" = "https://github.com/Tencent/AI-Infra-Guard/issues"

[tool.setuptools]
py-modules = ["cli_run"]
packages = { find = { include = ["cli*", "deepteam*", "utils*"] } }

[tool.setuptools.package-data]
"cli" = ["locales/zh_CN/LC_MESSAGES/*"]
"utils" = ["*.json"]
"deepteam.attacks.single_turn.encoding" = ["*.json"]
"deepteam.attacks.single_turn.stratasword" = ["*.json"]
