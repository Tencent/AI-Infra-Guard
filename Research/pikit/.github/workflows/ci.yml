name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Verify CLI entry point
        run: pikit list

  fixture-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate OpenClaw fixture
        working-directory: pikit/runtime_assets/openclaw_fixture
        run: |
          npm install
          npm run plugin:build
          npm run plugin:validate
      - name: Compile Hermes fixture
        run: python3 -m py_compile pikit/runtime_assets/hermes_fixture/*.py
