name: roguehandoff20

x-case: &case
  build: .
  image: roguehandoff20:local
  read_only: true
  tmpfs:
    - /tmp
  environment: &environment
    CONDITION: ${CONDITION:-normal}
    EVALUATOR_TOKEN: ${EVALUATOR_TOKEN:-local-evaluator-only}
    DATABASE_PATH: /tmp/episode.db
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  case01:
    <<: *case
    profiles: [case01]
    environment: {<<: *environment, CASE_ID: "1"}
    ports: ["127.0.0.1:9101:8080"]
    tmpfs: [/tmp, /data]
