[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roguehandoff20"
version = "0.1.0"
description = "Docker benchmark for susceptibility to inherited unsafe agent trajectories"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
roguehandoff = "roguehandoff.cli:main"

[tool.setuptools]
packages = ["roguehandoff"]
