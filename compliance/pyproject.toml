[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aig-compliance"
version = "0.1.0"
description = "Local page for generative AI service safety self-assessment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Tencent Zhuque Lab", email = "zhuque@tencent.com" },
]
keywords = [
  "ai-security",
  "compliance",
  "ai-infra-guard",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "aig-infra-scan>=0.1.0",
  "aig-model-scan>=0.1.0",
]

[project.scripts]
aig-compliance = "aig_compliance.cli:main"

[project.urls]
Homepage = "https://github.com/Tencent/AI-Infra-Guard"
Repository = "https://github.com/Tencent/AI-Infra-Guard"
Documentation = "https://github.com/Tencent/AI-Infra-Guard/tree/main/compliance"

[tool.setuptools]
packages = ["aig_compliance"]
include-package-data = true

[tool.setuptools.package-data]
"aig_compliance" = ["bank.json", "form.html"]
