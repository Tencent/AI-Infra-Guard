info:
  name: autogen-studio
  author: Elwood Ying
  severity: info
  desc: Web UI platform for Microsoft AutoGen multi-agent framework, supporting team orchestration, session management, and visual debugging of multi-agent workflows.
  metadata:
    product: autogen-studio
    vendor: microsoft
http:
  - method: GET
    path: '/'
    matchers:
      - body="<title>AutoGen Studio"
  - method: GET
    path: '/api/version'
    matchers:
      - body="Version retrieved successfully" && body="\"version\""
version:
  - method: GET
    path: '/api/version'
    extractor:
      part: body
      group: 1
      regex: '"version":\s*"(\d+\.\d+(?:\.\d+)?)'
