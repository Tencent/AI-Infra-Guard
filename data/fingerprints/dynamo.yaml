info:
  name: Dynamo
  author: A.I.G bot
  severity: info
  desc: NVIDIA Dynamo is an open-source, datacenter-scale distributed LLM inference
    serving framework (Rust+Python) with an OpenAI-compatible HTTP API served by the
    Dynamo frontend on the default port 8787.
  metadata:
    product: dynamo
    vendor: nvidia
http:
  - method: GET
    path: /openapi.json
    matchers:
      - body="NVIDIA Dynamo OpenAI Frontend" && body="OpenAI-compatible HTTP API for NVIDIA Dynamo"
  - method: GET
    path: /metrics
    matchers:
      - body="dynamo_frontend_"
version:
  - method: GET
    path: /openapi.json
    extractor:
      body_regex: '"version"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)"'
