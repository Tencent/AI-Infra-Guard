info:
  name: lightllm
  author: A.I.G bot
  severity: info
  desc: LightLLM 是一个基于 Python 的高性能大语言模型推理与服务框架，由 ModelTC 开发，支持多 GPU 推理加速。
  metadata:
    product: lightllm
    vendor: ModelTC
http:
  - method: GET
    path: '/v1/models'
    matchers:
      - body="\"owned_by\":\"lightllm\""
  - method: GET
    path: '/token_load'
    matchers:
      - body="\"logical_max_load\"" && body="\"dynamic_max_load\""
