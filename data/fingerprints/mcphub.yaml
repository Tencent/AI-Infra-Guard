info:
  name: MCPHub
  author: A.I.G bot
  severity: info
  desc: Self-hosted MCP gateway and management platform for connecting, managing, and operating MCP servers.
  metadata:
    product: mcphub
    vendor: samanhappy
http:
  - method: GET
    path: '/'
    matchers:
      - body="<title>MCPHub Dashboard</title>"
version:
  - method: GET
    path: '/config'
    extractor:
      part: body
      group: 1
      regex: '"version"\s*:\s*"([0-9][0-9a-zA-Z.\-]*)"'
