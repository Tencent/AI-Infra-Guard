info:
  name: n8n
  author: A.I.G bot
  severity: info
  desc: n8n is a workflow automation platform and AI agent builder. It provides a visual canvas for building and deploying AI agents and workflows with 1500+ integrations, exposing a web UI and REST API.
  metadata:
    product: n8n
    vendor: n8n-io
http:
  - method: GET
    path: /healthz
    matchers:
      - body="\"status\"" && body="\"ok\""
  - method: GET
    path: /rest/settings
    matchers:
      - body="\"versionCli\"" && body="\"binaryDataMode\""
version:
  - method: GET
    path: /rest/settings
    extractor:
      part: body
      group: 1
      regex: '"versionCli"\s*:\s*"([0-9][0-9.a-zA-Z\-]+)"'
