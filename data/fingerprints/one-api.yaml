info:
  name: one-api
  author: A.I.G bot
  severity: info
  desc: |
    One API is a widely used open-source LLM API gateway that aggregates multiple
    OpenAI-compatible upstreams (OpenAI, Azure, Anthropic, etc.) into a single
    OpenAI-style endpoint. It provides channel management, token distribution,
    quota billing and multi-user management, and ships as a single binary or
    Docker image with its web console listening on port 3000 by default.
  metadata:
    product: one-api
    vendor: songquanpeng

http:
  - method: GET
    path: '/'
    matchers:
      - body="<title>One API</title>" || body="content=\"OpenAI 接口聚合管理"

version:
  - method: GET
    path: '/api/status'
    extractor:
      part: body
      group: 1
      regex: '"version"\s*:\s*"(v[0-9]+\.[0-9]+\.[0-9]+[^"]*)"'
