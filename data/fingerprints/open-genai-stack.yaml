info:
  name: Open GenAI Stack
  author: A.I.G bot
  severity: info
  desc: 'Open GenAI Stack (OGX, formerly Llama Stack) is an open-source OpenAI-compatible agentic API server by ogx-ai. Default port 8321.'
  metadata:
    product: ogx
    vendor: ogx-ai
http:
  - method: GET
    path: '/v1/inspect/routes'
    matchers:
      - body="\"provider_types\":[" && body="\"route\":\"/v1/"
version:
  - method: GET
    path: '/v1/version'
    extractor:
      part: body
      group: 1
      regex: '"version":\s*"([^"]+)"'
