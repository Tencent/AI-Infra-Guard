info:
  name: ray
  author: 腾讯朱雀实验室
  severity: info
  desc: 一个开源框架，用于扩展AI和Python应用，提供分布式计算和机器学习工作负载的统一方式。
  metadata:
    product: dashboard
    vendor: ray
http:
  - method: GET
    path: '/api/cluster_status'
    matchers:
      - body="Got cluster status"
  - method: GET
    path: '/'
    matchers:
      - icon="463802404"
  - method: GET
    path: '/api/serve/applications/'
    matchers:
      - body="\"controller_info\"" && body="\"proxy_location\"" && body="SERVE_CONTROLLER_ACTOR"
version:
  - method: GET
    path: '/api/version'
    extractor:
      part: body
      group: 1
      regex: '"ray_version":\s*"([0-9]+\.[0-9]+\.[0-9]+)"'
