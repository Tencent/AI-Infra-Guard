report:
  patterns:
    - "${AIG_API_CHECKER_DATA_DIR}/qtest/result/json/*.json"
  output_rank_csv: "${AIG_API_CHECKER_DATA_DIR}/qtest/result/summary/vendors_rank.csv"
  output_long_csv: "${AIG_API_CHECKER_DATA_DIR}/qtest/result/summary/runs_long.csv"
  output_json: "${AIG_API_CHECKER_DATA_DIR}/qtest/result/summary/vendors_rank.json"
  sort_by: "mean_abs_Z"
  descending: false
