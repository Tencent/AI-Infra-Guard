# Default configuration mirroring the legacy `main.py` constants.
tests:
  - name: kimi-k2-multi
    result_dir: "${AIG_API_CHECKER_DATA_DIR}/qtest/result/json"
    # questions: leave empty or omit to auto-generate with random examples at runtime.
    questions: []
    runs_per_question: 2
    digits: 100
    temperature: 0.6
    top_logprobs: 20
    vendor_max_workers: 2
    max_inflight_ref_requests: 6
    align_tester_temperature: true
    tester:
      api_key: "${MOONSHOT_API_KEY}"
      base_url: "https://api.moonshot.cn/v1/chat/completions"
      model: "kimi-k2-0905-preview"
      temperature: 0.6
      top_logprobs: 20
      max_workers: 2
      request_delay: 0.3
      timeout_sec: 45.0
    vendors:
      - name: "kimi-k2-self"
        base_url: "https://api.moonshot.cn/"
        path: "/v1/chat/completions"
        api_key: "${MOONSHOT_API_KEY}"
        model: "kimi-k2-0905-preview"
        schema: "openai"
      - name: "kimi-k2-turbo"
        base_url: "https://api.moonshot.cn/"
        path: "/v1/chat/completions"
        api_key: "${MOONSHOT_API_KEY}"
        model: "kimi-k2-turbo-preview"
        schema: "openai"
      - name: "siliconflow-free"
        base_url: "https://api.siliconflow.cn"
        path: "/v1/chat/completions"
        api_key: "${SILICONFLOW_API_KEY}"
        model: "moonshotai/Kimi-K2-Instruct-0905"
        schema: "openai"
      - name: "siliconflow-pro"
        base_url: "https://api.siliconflow.cn"
        path: "/v1/chat/completions"
        api_key: "${SILICONFLOW_API_KEY}"
        model: "Pro/moonshotai/Kimi-K2-Instruct-0905"
        schema: "openai"
      - name: "chutes"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "chutes/fp8"
          allow_fallbacks: false
      - name: "deepinfra"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "deepinfra/fp4"
          allow_fallbacks: false
      - name: "fireworks"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "fireworks/fp8"
          allow_fallbacks: false
      - name: "novita"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "novita/fp8"
          allow_fallbacks: false
      - name: "atlas-cloud"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "atlas-cloud/fp8"
          allow_fallbacks: false
      - name: "baseten"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "baseten/fp4"
          allow_fallbacks: false
      - name: "together"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "together"
          allow_fallbacks: false
      - name: "groq"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "groq"
          allow_fallbacks: false
      - name: "wandb"
        base_url: "https://openrouter.ai"
        path: "/api/v1/chat/completions"
        api_key: "${OPENROUTER_API_KEY}"
        model: "moonshotai/kimi-k2-0905"
        schema: "openai"
        provider:
          order:
            - "wandb/fp8"
          allow_fallbacks: false
    payload:
      official_baseline_vendor: "kimi-k2-self"
